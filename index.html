<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff4fc8">
<title>Sweet Crazy — каталог сладостей</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="sweets">
<header>
 <div class="top">
  <div class="brand"><div class="logo" id="logo">🍭</div><div><h1>SWEET CRAZY</h1><small>ДЕТСКИЕ СЛАДОСТИ</small></div></div>
 </div>
 <div class="hero"><div><h2 id="heroTitle"></h2><p id="heroText"></p></div><div class="hero-sticker" id="heroSticker"></div></div>
</header>
<main id="main">
 <div class="tabs">
  <button class="tab" data-sec="sweets" onclick="setSection('sweets')">🍭 Сладости</button>
  <button class="tab" data-sec="dairy" onclick="setSection('dairy')">🥛 Молочные продукты</button>
 </div>
 <div class="admin-bar hidden" id="adminBar"><span>✏️ Режим редактирования</span><span class="admin-btns"><button onclick="editProduct(null,section)">＋ Товар</button><button onclick="exportData()">⬇️ Копия</button><button onclick="logout()">Выйти</button></span></div>
 <div class="toolbar">
  <input id="search" class="search" oninput="render()">
  <select id="sort" class="filter" onchange="render()"><option value="default">По порядку</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option><option value="az">По названию</option></select>
 </div>
 <div class="chips" id="chips"></div>
 <div class="summary"><span id="countLabel"></span><span>Цены за единицу упаковки</span></div>
 <div class="grid" id="products"></div>
</main>
<footer>© Sweet Crazy · <button id="adminLink" onclick="openLogin()">Вход для владельца</button></footer>
<div class="bottom-cart" id="bottomCart" style="display:none"><div><small id="cartCount"></small><strong id="cartSum"></strong></div><button class="cart-open" onclick="openCart()">Корзина →</button></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" id="sheet"></section></div>
<script src="js/app.js"></script>
</body>
</html>
